name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Calculate commit-count version
        id: version
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Set up Node.js for web app verification
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test web app update lifecycle
        run: node tests/pwa-updates.mjs

      - name: Test browser UI
        run: node tests/ui.mjs

      - name: Verify private Brave settings and research integration
        run: AGENT_SETTINGS_BROWSER=1 go test -run '^TestResearchSettingsBrowser$' -count=1 -v .

      - name: Build two production versions for PWA verification
        run: |
          go build -ldflags="-X main.version=pwa-test-a" -o "$RUNNER_TEMP/agent-pwa-a" .
          go build -ldflags="-X main.version=pwa-test-b" -o "$RUNNER_TEMP/agent-pwa-b" .

      - name: Verify Run Inspector against the production server
        run: node tests/run-inspector-browser.mjs "$RUNNER_TEMP/agent-pwa-a"

      - name: Verify task-scoped research consent against the production server
        run: node tests/research-browser.mjs "$RUNNER_TEMP/agent-pwa-a"

      - name: Verify installability, offline privacy, and explicit updates
        run: node tests/pwa-browser.mjs "$RUNNER_TEMP/agent-pwa-a" "$RUNNER_TEMP/agent-pwa-b"

  publish:
    outputs:
      services_artifact: ${{ steps.services_capture.outputs.artifact }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/everyonesoftware/agent
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and push image
        id: services_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture original Services publication metadata
        id: services_capture
        continue-on-error: true
        env:
          PUBLISHED_DIGEST: ${{ steps.services_push.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          APP_VERSION: ${{ needs.verify.outputs.version }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs capture

      - name: Retain original Services payload for notification-only retries
        if: steps.services_capture.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.services_capture.outputs.artifact }}
          path: ${{ runner.temp }}/services-publish/published.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
          archive: true


  services_notify:
    name: Notify Services (publication remains separate)
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && needs.publish.result == 'success' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require original payload artifact
        env:
          PAYLOAD_ARTIFACT: ${{ needs.publish.outputs.services_artifact }}
        run: test -n "$PAYLOAD_ARTIFACT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.services_artifact }}
          path: ${{ runner.temp }}/services-publish
          digest-mismatch: error
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAGS }}
          log-mode: quiet
      - name: Send the retained original payload without rebuilding
        env:
          SERVICES_PUBLISH_URL: ${{ vars.SERVICES_PUBLISH_URL }}
          SERVICES_PUBLISH_TOKEN: ${{ secrets.SERVICES_PUBLISH_TOKEN }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs send
