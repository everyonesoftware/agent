name: Agent CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      component:
        description: Force one platform, all, or automatic verified-baseline selection
        type: choice
        options: [auto, all, android, windows, container]
        default: auto
        required: true

permissions:
  contents: read

concurrency:
  group: services-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      android: ${{ steps.selection.outputs.android }}
      windows: ${{ steps.selection.outputs.windows }}
      container: ${{ steps.selection.outputs.container }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure isolated test storage and browser diagnostics
        run: printf 'TMPDIR=%s\nBROWSER_ARTIFACTS=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP/agent-browser-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate release workflow syntax and expression contexts
        # GitHub supports queue:max; actionlint 1.7.12 has not added that key yet.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= -ignore '^unexpected key "queue" for "concurrency" section[.]' .github/workflows/publish-image.yml

      - name: Calculate commit-count version
        id: version
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Set up Node.js for web app verification
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install locked browser tooling
        run: npm ci --prefix tests/browser-tools --ignore-scripts --no-audit --no-fund

      - name: Test browser lifecycle diagnostics and CI contract
        run: node --test tests/browser-launcher.test.mjs tests/browser-ci.test.mjs

      - name: Install exact Chrome for Testing and its system dependencies
        run: |
          sudo apt-get update
          sudo env "PATH=$PATH" "GITHUB_ENV=$GITHUB_ENV" node tests/browser-tools/install.mjs "$RUNNER_TEMP/agent-cft" --install-deps

      - name: Verify sandbox-enabled browser startup and pinned CDP version
        run: node tests/browser-tools/preflight.mjs

      - name: Test web app update lifecycle
        run: node tests/pwa-updates.mjs

      - name: Test browser UI
        run: node tests/ui.mjs

      - name: Verify unified Codex device sign-in and account isolation
        run: |
          node tests/codex-connection-ui.mjs
          AGENT_CODEX_BROWSER=1 go test -run '^TestCodexConnectionProductionBrowser$' -count=1 -v .

      - name: Verify usage history charts and provider-scoped Settings popups
        run: |
          node tests/usage-history-ui.mjs --browser
          AGENT_HISTORY_BROWSER=1 go test -run '^TestUsageHistoryProductionBrowser$' -count=1 -v .

      - name: Test memory controls and context disclosure
        run: node tests/memory-ui.mjs

      - name: Verify private Brave settings and research integration
        run: AGENT_SETTINGS_BROWSER=1 go test -run '^TestResearchSettingsBrowser$' -count=1 -v .

      - name: Build two production versions for PWA verification
        run: |
          go build -ldflags="-X main.version=pwa-test-a" -o "$RUNNER_TEMP/agent-pwa-a" .
          go build -ldflags="-X main.version=pwa-test-b" -o "$RUNNER_TEMP/agent-pwa-b" .

      - name: Verify Run Inspector against the production server
        run: node tests/run-inspector-browser.mjs "$RUNNER_TEMP/agent-pwa-a"

      - name: Verify account memory against the production server
        env:
          MEMORY_SCRATCH: ${{ runner.temp }}/agent-memory
        run: node tests/memory-browser.mjs "$RUNNER_TEMP/agent-pwa-a"

      - name: Verify task-scoped research consent against the production server
        run: node tests/research-browser.mjs "$RUNNER_TEMP/agent-pwa-a"

      - name: Verify installability, offline privacy, and explicit updates
        run: node tests/pwa-browser.mjs "$RUNNER_TEMP/agent-pwa-a" "$RUNNER_TEMP/agent-pwa-b"

      - name: Test native publication, real Git selection, changelog and download table contracts
        run: node --test tests/native-*.test.mjs tests/current-downloads.test.mjs

      - name: Select platform inputs against verified publications
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FORCE_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component != 'auto' && inputs.component || 'none' }}
        run: node scripts/native-selection.mjs --repository "$REPOSITORY" --force "$FORCE_COMPONENT" --github-output "$GITHUB_OUTPUT"

      - name: Retain bounded browser startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-browser-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  publish:
    outputs:
      services_artifact: ${{ steps.services_capture.outputs.artifact }}
    needs: verify
    if: needs.verify.outputs.container == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/everyonesoftware/agent
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and push image
        id: services_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture original Services publication metadata
        id: services_capture
        continue-on-error: true
        env:
          PUBLISHED_DIGEST: ${{ steps.services_push.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          APP_VERSION: ${{ needs.verify.outputs.version }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs capture

      - name: Retain original Services payload for notification-only retries
        if: steps.services_capture.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.services_capture.outputs.artifact }}
          path: ${{ runner.temp }}/services-publish/published.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
          archive: true
      - name: Verify registry digest and retain container publication identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          COMMIT_COUNT: ${{ needs.verify.outputs.version }}
          IMAGE_DIGEST: ${{ steps.services_push.outputs.digest }}
        run: node scripts/native-release.mjs container --repository "$REPOSITORY" --directory dist/container --commit "$SOURCE_COMMIT" --count "$COMMIT_COUNT" --digest "$IMAGE_DIGEST"

      - name: Retain verified container publication
        uses: actions/upload-artifact@v7
        with:
          name: agent-container-${{ github.sha }}
          path: dist/container/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  android:
    needs: verify
    if: needs.verify.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test and lint native Android
        env:
          COMMIT_COUNT: ${{ needs.verify.outputs.version }}
        run: |
          node --test apps/android/*.test.mjs
          bash apps/android/gradlew -p apps/android "-PagentCommitCount=$COMMIT_COUNT" :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build dedicated-key signed APK and verify package, version and signer
        env:
          COMMIT_COUNT: ${{ needs.verify.outputs.version }}
          AGENT_KEYSTORE_BASE64: ${{ secrets.AGENT_KEYSTORE_BASE64 }}
          AGENT_KEYSTORE_PASSWORD: ${{ secrets.AGENT_KEYSTORE_PASSWORD }}
          AGENT_KEY_ALIAS: ${{ secrets.AGENT_KEY_ALIAS }}
          AGENT_KEY_PASSWORD: ${{ secrets.AGENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AGENT_KEYSTORE_BASE64 AGENT_KEYSTORE_PASSWORD AGENT_KEY_ALIAS AGENT_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
          umask 077
          export AGENT_KEYSTORE_PATH="$RUNNER_TEMP/agent-release.jks"
          trap 'rm -f "$AGENT_KEYSTORE_PATH"' EXIT
          printf '%s' "$AGENT_KEYSTORE_BASE64" | base64 --decode > "$AGENT_KEYSTORE_PATH"
          bash apps/android/gradlew -p apps/android "-PagentCommitCount=$COMMIT_COUNT" :app:assembleRelease --no-daemon
          node scripts/native-release.mjs package-android --apk apps/android/app/build/outputs/apk/release/app-release.apk --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --directory dist/android
      - name: Retain signed Android publication
        uses: actions/upload-artifact@v7
        with:
          name: agent-android-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  windows:
    needs: verify
    if: needs.verify.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: apps/windows/global.json
      - name: Build and test real self-contained Windows package and feed
        env:
          NATIVE_VERSION: 0.1.${{ needs.verify.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/windows-build.ps1 -OutputDirectory dist/windows -Version $env:NATIVE_VERSION -Commit $env:SOURCE_COMMIT
      - name: Verify exact installer, package and feed inventory
        run: node scripts/native-release.mjs verify --directory dist
      - name: Install and launch the packaged native app
        timeout-minutes: 6
        run: ./scripts/test-windows-installer.ps1 -InstallerPath dist/windows/AgentWindows-win-x64-Setup.exe -EvidenceDirectory dist/windows-smoke
      - name: Retain Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-windows-smoke-${{ github.sha }}
          path: dist/windows-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified Windows publication
        uses: actions/upload-artifact@v7
        with:
          name: agent-windows-${{ github.sha }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  release:
    needs: [verify, android, windows, publish]
    if: always() && !cancelled() && needs.verify.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out exact source with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        if: needs.android.result == 'success'
        with:
          name: agent-android-${{ github.sha }}
          path: dist/android
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        if: needs.windows.result == 'success'
        with:
          name: agent-windows-${{ github.sha }}
          path: dist/windows
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        if: needs.publish.result == 'success'
        with:
          name: agent-container-${{ github.sha }}
          path: dist/container
          digest-mismatch: error
      - name: Publish new platform bytes without clobber and read exact assets back
        if: needs.android.result == 'success' || needs.windows.result == 'success' || needs.publish.result == 'success'
        run: node scripts/native-release.mjs publish --repository "$GH_REPO" --directory dist
      - name: Refresh both Current downloads tables from the same verified inventory
        run: node scripts/current-downloads.mjs --repository "$GH_REPO" --output-directory dist/current-downloads --publish

  services_notify:
    name: Notify Services (publication remains separate)
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && needs.publish.result == 'success' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require original payload artifact
        env:
          PAYLOAD_ARTIFACT: ${{ needs.publish.outputs.services_artifact }}
        run: test -n "$PAYLOAD_ARTIFACT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.services_artifact }}
          path: ${{ runner.temp }}/services-publish
          digest-mismatch: error
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAGS }}
          log-mode: quiet
      - name: Send the retained original payload without rebuilding
        env:
          SERVICES_PUBLISH_URL: ${{ vars.SERVICES_PUBLISH_URL }}
          SERVICES_PUBLISH_TOKEN: ${{ secrets.SERVICES_PUBLISH_TOKEN }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs send
