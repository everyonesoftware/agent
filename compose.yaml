services:
  everyoneagent:
    image: everyonesoftware/agent:${APP_VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    container_name: everyoneagent
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      # Bind only to this PC; use Tailscale Serve for tailnet access.
      - "127.0.0.1:8080:8080"
