services:
  everyoneagent:
    image: ghcr.io/everyonesoftware/agent:${APP_VERSION:-latest}
    pull_policy: always
    container_name: everyoneagent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/everyoneagent", "healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      PORT: "8080"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SIWC_DATA_DIR: /data
      SIWC_REDIRECT_URI: ${SIWC_REDIRECT_URI:-http://127.0.0.1:8080/auth/callback}
    volumes:
      - everyoneagent-data:/data
    ports:
      # Bind only to this PC; use Tailscale Serve for tailnet access.
      - "127.0.0.1:8080:8080"

volumes:
  everyoneagent-data:
